# Render Blueprint: PostgreSQL + backend (API and demo apps) + dashboard, all from Docker.
# Render dashboard: New > Blueprint > pick this repo. Then fill in the secret marked "sync: false" (GEMINI_API_KEY).
# If Render gives a service a different public URL than the one written below (the name was taken), update the two URL values and redeploy
# the dashboard: NEXT_PUBLIC_API_URL is compiled in at build time.
databases:
  - name: glitchhunter-db
    databaseName: glitchhunter
    user: glitchhunter
    plan: free                  # free PostgreSQL: deleted after 30 days. Use a paid plan (for example basic-256mb) for anything longer.
    ipAllowList: []             # only services inside Render can connect

services:
  - type: web
    name: glitchhunter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                  # free web services sleep after ~15 minutes idle (the first request then takes a minute) and have little memory
    healthCheckPath: /health
    envVars:
      - key: GH_DATABASE_URL
        fromDatabase:
          name: glitchhunter-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false             # enter it in the Render dashboard, never in this file
      - key: GH_CORS_ORIGINS
        value: https://glitchhunter-web.onrender.com
      - key: GH_DISABLE_UPLOADS   # "0" = the "Your own code" feature is ON for everyone who has the URL (the API has no login). Set "1" to switch it off.
        value: "0"
      - key: LLM_OLLAMA_FALLBACK
        value: "0"

  - type: web
    name: glitchhunter-web
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    plan: free                  # free web services sleep after ~15 minutes idle (the first request then takes a minute) and have little memory
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://glitchhunter-api-lz3x.onrender.com
      - key: NEXT_PUBLIC_USE_MOCK
        value: "false"
